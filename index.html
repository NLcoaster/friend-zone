<!DOCTYPE html>
<html>

<head>
    <title>uNmINeD</title>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <!-- OpenLayers  -->
    <link rel="stylesheet" type="text/css" href="lib/ol.css">
    <script src="lib/ol.js"></script>

    <!-- OpenLayers Context Menu -->
    <link href="lib/ol-contextmenu.css" rel="stylesheet">
    <script src="lib/ol-contextmenu.iife.js"></script>

    <!-- Toastify -->
    <script type="text/javascript" src="lib/toastify-js.js"></script>
    <link rel="stylesheet" type="text/css" href="lib/toastify-js.min.css">

    <!-- Map metadata generated by uNmINeD -->
    <script type="text/javascript" src="unmined.map.properties.js"></script>
    <script type="text/javascript" src="unmined.map.regions.js"></script>
    <script type="text/javascript" src="unmined.map.players.js"></script>

    <!-- Custom spawnpoint -->
    <script type="text/javascript" src="custom.spawnpoint.js"></script>
    <!-- Custom villages -->
    <script type="text/javascript" src="custom.villages.js"></script>
    <!-- Custom pillagers -->
    <script type="text/javascript" src="custom.pillager.js"></script>
    <!-- Custom shipwrecks -->
    <script type="text/javascript" src="custom.shipwrecks.js"></script>
    <!-- Custom Temples -->
    <script type="text/javascript" src="custom.temples.js"></script>
    <!-- Custom portals -->
    <script type="text/javascript" src="custom.portals.js"></script>
    <!-- Custom underground -->
    <script type="text/javascript" src="custom.underground.js"></script>
    <!-- Custom playerbuild -->
    <script type="text/javascript" src="custom.playerbuild.js"></script>
    <!-- Custom landscapes -->
    <script type="text/javascript" src="custom.landscapes.js"></script>

    <!-- uNmINeD JS and CSS -->
    <script type="text/javascript" src="unmined.js"></script>
    <link rel="stylesheet" type="text/css" href="index.css">

</head>

<body>
    <div id="map"></div>

    <div class="dim-nav">

        <!-- Overworld knop met dropdown -->
        <div class="dim-nav-dropdown">
            <a href="index.html" class="active" id="btn-overworld"> Overworld ▾</a>
            <div class="dim-nav-menu" id="layer-menu">
                <div class="dim-nav-menu-title">Layers</div>

                <!-- Villages -->
                <div class="sub-group">
                    <label class="sub-header">
                        <input type="checkbox" id="toggle-villages-all" checked> <strong>Villages</strong>
                    </label>
                    <div class="sub-items">
                        <label><input type="checkbox" id="toggle-igloo"           checked>  Igloo</label>
                        <label><input type="checkbox" id="toggle-igloo-basement"  checked>  Igloo with basement</label>
                        <label><input type="checkbox" id="toggle-village"         checked>  Village</label>
                        <label><input type="checkbox" id="toggle-zombie-village"  checked>  Zombie Village</label>
                    </div>
                </div>

                <!-- Pillager -->
                <div class="sub-group">
                    <label class="sub-header">
                        <input type="checkbox" id="toggle-pillager-all" checked> <strong>Pillager</strong>
                    </label>
                    <div class="sub-items">
                        <label><input type="checkbox" id="toggle-pillager-outpost" checked>  Pillager Outpost</label>
                        <label><input type="checkbox" id="toggle-witch-hut"        checked>  Witch Hut</label>
                    </div>
                </div>

                <!-- Shipwrecks -->
                <div class="sub-group">
                    <label class="sub-header">
                        <input type="checkbox" id="toggle-shipwrecks-all" checked> <strong>Shipwrecks</strong>
                    </label>
                    <div class="sub-items">
                        <label><input type="checkbox" id="toggle-shipwreck" checked>  Shipwreck</label>
                        <label><input type="checkbox" id="toggle-treasure"  checked>  Treasure Chest</label>
                    </div>
                </div>

                <!-- Temples -->
                <div class="sub-group">
                    <label class="sub-header">
                        <input type="checkbox" id="toggle-temples-all" checked> <strong>Temples</strong>
                    </label>
                    <div class="sub-items">
                        <label><input type="checkbox" id="toggle-desert-pyramid"  checked>  Desert Pyramid</label>
                        <label><input type="checkbox" id="toggle-desert-well"     checked>  Desert Well</label>
                        <label><input type="checkbox" id="toggle-jungle-pyramid"  checked>  Jungle Pyramid</label>
                        <label><input type="checkbox" id="toggle-ocean-ruin"      checked>  Ocean Ruin</label>
                        <label><input type="checkbox" id="toggle-ocean-monument"  checked>  Ocean Monument</label>
                    </div>
                </div>

                <!-- Portals -->
                <div class="sub-group">
                    <label class="sub-header">
                        <input type="checkbox" id="toggle-portals-all" checked> <strong>Portals</strong>
                    </label>
                    <div class="sub-items">
                        <label><input type="checkbox" id="toggle-nether-portal"  checked>  Nether Portal</label>
                        <label><input type="checkbox" id="toggle-ruined-portal"  checked>  Ruined Portal</label>
                        <label><input type="checkbox" id="toggle-end-portal"     checked>  End Portal</label>
                    </div>
                </div>

                <!-- Underground -->
                <div class="sub-group">
                    <label class="sub-header">
                        <input type="checkbox" id="toggle-underground-all" checked> <strong>Underground</strong>
                    </label>
                    <div class="sub-items">
                        <label><input type="checkbox" id="toggle-ancient-city"    checked>  Ancient City</label>
                        <label><input type="checkbox" id="toggle-mineshaft"       checked>  Mineshaft</label>
                        <label><input type="checkbox" id="toggle-stronghold"      checked>  Stronghold</label>
                        <label><input type="checkbox" id="toggle-trail-ruin"      checked>  Trail Ruin</label>
                        <label><input type="checkbox" id="toggle-trial-chamber"   checked>  Trial Chamber</label>
                    </div>
                </div>

                <label><input type="checkbox" id="toggle-playerbuild" checked>  Playerbuild</label>
                <label><input type="checkbox" id="toggle-landscapes"  checked>  Landscapes</label>
            </div>
        </div>

        <a href="Nether/index.html"> Nether</a>
        <a href="End/index.html"> End</a>
        <a href="empty world/index.html"> Empty</a>
    </div>

    <script type="text/javascript">

        document.title = UnminedMapProperties.worldName + " - " + document.title;

        if (typeof UnminedCustomSpawnpoint !== "undefined" &&
            UnminedCustomSpawnpoint.isEnabled &&
            UnminedCustomSpawnpoint.spawnpoint) {
            UnminedMapProperties.spawnpoint = UnminedCustomSpawnpoint.spawnpoint;
        }

        if (typeof UnminedCustomVillages !== "undefined" && UnminedCustomVillages.isEnabled) {
            try {
                const vt = UnminedCustomVillages.getByType();
                UnminedMapProperties.villages_igloo         = vt.igloo;
                UnminedMapProperties.villages_iglooBasement = vt.iglooBasement;
                UnminedMapProperties.villages_village       = vt.village;
                UnminedMapProperties.villages_zombie        = vt.zombieVillage;
            } catch (e) {
                console.warn('custom.villages.js: getByType() niet gevonden. Heb je het bestand bijgewerkt?', e);
            }
        }

        if (typeof UnminedCustomPillager !== "undefined" && UnminedCustomPillager.isEnabled) {
            try {
                const pt = UnminedCustomPillager.getByType();
                UnminedMapProperties.pillager_outpost = pt.pillager_outpost;
                UnminedMapProperties.witch_hut        = pt.witch_hut;
            } catch (e) { console.warn('custom.pillager.js getByType() fout:', e); }
        }

        if (typeof UnminedCustomShipwrecks !== "undefined" && UnminedCustomShipwrecks.isEnabled) {
            try {
                const st = UnminedCustomShipwrecks.getByType();
                UnminedMapProperties.shipwrecks_shipwreck = st.shipwreck;
                UnminedMapProperties.shipwrecks_treasure  = st.treasure;
            } catch (e) { console.warn('custom.shipwrecks.js getByType() fout:', e); }
        }

        if (typeof UnminedCustomTemples !== "undefined" && UnminedCustomTemples.isEnabled) {
            try {
                const tt = UnminedCustomTemples.getByType();
                UnminedMapProperties.temples_desert_pyramid = tt.desert_pyramid;
                UnminedMapProperties.temples_desert_well    = tt.desert_well;
                UnminedMapProperties.temples_jungle_pyramid = tt.jungle_pyramid;
                UnminedMapProperties.temples_ocean_ruin     = tt.ocean_ruin;
                UnminedMapProperties.temples_ocean_monument = tt.ocean_monument;
            } catch (e) { console.warn('custom.temples.js getByType() fout:', e); }
        }

        if (typeof UnminedCustomPortals !== "undefined" && UnminedCustomPortals.isEnabled) {
            try {
                const pot = UnminedCustomPortals.getByType();
                UnminedMapProperties.portals_nether_portal = pot.nether_portal;
                UnminedMapProperties.portals_ruined_portal = pot.ruined_portal;
                UnminedMapProperties.portals_end_portal    = pot.end_portal;
            } catch (e) { console.warn('custom.portals.js getByType() fout:', e); }
        }

        if (typeof UnminedCustomUnderground !== "undefined" && UnminedCustomUnderground.isEnabled) {
            try {
                const ut = UnminedCustomUnderground.getByType();
                UnminedMapProperties.underground_ancient_city        = ut.ancient_city;
                UnminedMapProperties.underground_abandoned_mineshaft = ut.abandoned_mineshaft;
                UnminedMapProperties.underground_stronghold          = ut.stronghold;
                UnminedMapProperties.underground_trail_ruin          = ut.trail_ruin;
                UnminedMapProperties.underground_trial_chamber       = ut.trial_chamber;
            } catch (e) { console.warn('custom.underground.js getByType() fout:', e); }
        }

        if (typeof UnminedCustomPlayerbuild !== "undefined" &&
            UnminedCustomPlayerbuild.isEnabled &&
            UnminedCustomPlayerbuild.playerbuild) {
            UnminedMapProperties.playerbuild = UnminedCustomPlayerbuild.playerbuild;
        }

        if (typeof UnminedCustomLandscapes !== "undefined" &&
            UnminedCustomLandscapes.isEnabled &&
            UnminedCustomLandscapes.landscapes) {
            UnminedMapProperties.landscapes = UnminedCustomLandscapes.landscapes;
        }

        if (UnminedPlayers && UnminedPlayers.length > 0) {
            UnminedMapProperties.playerMarkers = Unmined.createPlayerMarkers(UnminedPlayers);
        }

        const mapElement = document.getElementById('map');
        const unmined = new Unmined(mapElement, UnminedMapProperties, UnminedRegions);

        // ── Dropdown toggle ──────────────────────────────────────
        const btn  = document.getElementById('btn-overworld');
        const menu = document.getElementById('layer-menu');

        btn.addEventListener('click', (e) => {
            e.preventDefault();
            menu.classList.toggle('open');
        });

        // Sluit menu bij klik buiten
        document.addEventListener('click', (e) => {
            if (!btn.contains(e.target) && !menu.contains(e.target)) {
                menu.classList.remove('open');
            }
        });

        // ── Hulpfuncties ─────────────────────────────────────────

        // Zet hoofd-checkbox op checked / unchecked / indeterminate
        // op basis van de huidige staat van de sub-checkboxes.
        function syncParentCheckbox(allId, subToggles) {
            const states = subToggles.map(({ id }) => document.getElementById(id).checked);
            const allOn  = states.every(Boolean);
            const allOff = states.every(v => !v);
            const el     = document.getElementById(allId);
            el.checked       = allOn;
            el.indeterminate = !allOn && !allOff;
        }

        // Koppelt een groep sub-checkboxes aan een hoofd-checkbox.
        //   subToggles : [{ id, key }, ...]
        //   allId      : id van de hoofd-checkbox
        //   setVisible : (key, boolean) => void
        function bindGroupToggles(subToggles, allId, setVisible) {
            // Sub-checkbox gewijzigd → laag tonen/verbergen + hoofd bijwerken
            subToggles.forEach(({ id, key }) => {
                document.getElementById(id).addEventListener('change', (e) => {
                    setVisible(key, e.target.checked);
                    syncParentCheckbox(allId, subToggles);
                });
            });

            // Hoofd-checkbox gewijzigd → alle subs + lagen tegelijk aan/uit
            document.getElementById(allId).addEventListener('change', (e) => {
                subToggles.forEach(({ id, key }) => {
                    setVisible(key, e.target.checked);
                    document.getElementById(id).checked = e.target.checked;
                });
                document.getElementById(allId).indeterminate = false;
            });
        }

        // ── Villages ─────────────────────────────────────────────
        bindGroupToggles([
            { id: 'toggle-igloo',          key: 'villages_igloo'         },
            { id: 'toggle-igloo-basement', key: 'villages_iglooBasement' },
            { id: 'toggle-village',        key: 'villages_village'       },
            { id: 'toggle-zombie-village', key: 'villages_zombie'        },
        ], 'toggle-villages-all', (key, visible) => unmined.customLayers[key]?.setVisible(visible));

        // ── Pillager ─────────────────────────────────────────────
        bindGroupToggles([
            { id: 'toggle-pillager-outpost', key: 'pillager_outpost' },
            { id: 'toggle-witch-hut',        key: 'witch_hut'        },
        ], 'toggle-pillager-all', (key, visible) => unmined.customLayers[key]?.setVisible(visible));

        // ── Shipwrecks ───────────────────────────────────────────
        bindGroupToggles([
            { id: 'toggle-shipwreck', key: 'shipwrecks_shipwreck' },
            { id: 'toggle-treasure',  key: 'shipwrecks_treasure'  },
        ], 'toggle-shipwrecks-all', (key, visible) => unmined.customLayers[key]?.setVisible(visible));

        // ── Temples ──────────────────────────────────────────────
        bindGroupToggles([
            { id: 'toggle-desert-pyramid', key: 'temples_desert_pyramid' },
            { id: 'toggle-desert-well',    key: 'temples_desert_well'    },
            { id: 'toggle-jungle-pyramid', key: 'temples_jungle_pyramid' },
            { id: 'toggle-ocean-ruin',     key: 'temples_ocean_ruin'     },
            { id: 'toggle-ocean-monument', key: 'temples_ocean_monument' },
        ], 'toggle-temples-all', (key, visible) => unmined.customLayers[key]?.setVisible(visible));

        // ── Portals ──────────────────────────────────────────────
        bindGroupToggles([
            { id: 'toggle-nether-portal', key: 'portals_nether_portal' },
            { id: 'toggle-ruined-portal', key: 'portals_ruined_portal' },
            { id: 'toggle-end-portal',    key: 'portals_end_portal'    },
        ], 'toggle-portals-all', (key, visible) => unmined.customLayers[key]?.setVisible(visible));

        // ── Underground ──────────────────────────────────────────
        bindGroupToggles([
            { id: 'toggle-ancient-city',  key: 'underground_ancient_city'        },
            { id: 'toggle-mineshaft',     key: 'underground_abandoned_mineshaft' },
            { id: 'toggle-stronghold',    key: 'underground_stronghold'          },
            { id: 'toggle-trail-ruin',    key: 'underground_trail_ruin'          },
            { id: 'toggle-trial-chamber', key: 'underground_trial_chamber'       },
        ], 'toggle-underground-all', (key, visible) => unmined.customLayers[key]?.setVisible(visible));

        // ── Losse lagen (geen sub-items) ─────────────────────────
        ['toggle-playerbuild', 'toggle-landscapes'].forEach(id => {
            const key = id.replace('toggle-', '');
            document.getElementById(id).addEventListener('change', (e) => {
                unmined.customLayers[key]?.setVisible(e.target.checked);
            });
        });

    </script>
</body>

</html>
