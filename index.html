<!DOCTYPE html>
<html>

<head>
    <title>uNmINeD</title>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <!-- OpenLayers  -->
    <link rel="stylesheet" type="text/css" href="lib/ol.css">
    <script src="lib/ol.js"></script>

    <!-- OpenLayers Context Menu -->
    <link href="lib/ol-contextmenu.css" rel="stylesheet">
    <script src="lib/ol-contextmenu.iife.js"></script>

    <!-- Toastify -->
    <script type="text/javascript" src="lib/toastify-js.js"></script>
    <link rel="stylesheet" type="text/css" href="lib/toastify-js.min.css">


    <!-- Map metadata generated by uNmINeD -->
    <script type="text/javascript" src="unmined.map.properties.js"></script>
    <script type="text/javascript" src="unmined.map.regions.js"></script>
    <script type="text/javascript" src="unmined.map.players.js"></script>

    <!-- Custom spawnpoint =-->
    <script type="text/javascript" src="custom.spawnpoint.js"></script>
	
	 <!-- Custom villages -->
    <script type="text/javascript" src="custom.villages.js"></script>
	
	<!-- Custom pillagers -->
    <script type="text/javascript" src="custom.pillager.js"></script>
	
	<!-- Custom shipwrecks -->
    <script type="text/javascript" src="custom.shipwrecks.js"></script>
	
	<!-- Custom Temples -->
    <script type="text/javascript" src="custom.temples.js"></script>
	
	<!-- Custom portals -->
    <script type="text/javascript" src="custom.portals.js"></script>
	
	<!-- Custom underground -->
    <script type="text/javascript" src="custom.underground.js"></script>	
	
	<!-- Custom playerbuild -->
    <script type="text/javascript" src="custom.playerbuild.js"></script>
	
	<!-- Custom landscapes -->
    <script type="text/javascript" src="custom.landscapes.js"></script>

    <!-- uNmINeD JS and CSS -->
    <script type="text/javascript" src="unmined.js"></script>
    <link rel="stylesheet" type="text/css" href="index.css">
        
    </style>

</head>

<body>
    <div id="map"></div>

    <script type="text/javascript">

document.title = UnminedMapProperties.worldName + " - " + document.title;


// Custom spawnpoint
if (typeof UnminedCustomSpawnpoint !== "undefined" &&
    UnminedCustomSpawnpoint.isEnabled &&
    UnminedCustomSpawnpoint.spawnpoint) {

    UnminedMapProperties.spawnpoint = UnminedCustomSpawnpoint.spawnpoint;
}


// Villages
if (typeof UnminedCustomVillages !== "undefined" &&
    UnminedCustomVillages.isEnabled &&
    UnminedCustomVillages.villages) {

    UnminedMapProperties.villages = UnminedCustomVillages.villages;
}


// Pillager
if (typeof UnminedCustomPillager !== "undefined" &&
	UnminedCustomPillager.isEnabled &&
    UnminedCustomPillager.pillager) {
	
    UnminedMapProperties.pillager = UnminedCustomPillager.pillager;
}


// Shipwreck
if (typeof UnminedCustomShipwrecks !== "undefined" &&
    UnminedCustomShipwrecks.isEnabled &&
    UnminedCustomShipwrecks.shipwrecks) {
    
    UnminedMapProperties.shipwrecks = UnminedCustomShipwrecks.shipwrecks;
}


// Temples
if (typeof UnminedCustomTemples !== "undefined" &&
    UnminedCustomTemples.isEnabled &&
    UnminedCustomTemples.temples) {
    
    UnminedMapProperties.temples = UnminedCustomTemples.temples;
}


// Portals
if (typeof UnminedCustomPortals !== "undefined" &&
    UnminedCustomPortals.isEnabled &&
    UnminedCustomPortals.portals) {
    
    UnminedMapProperties.portals = UnminedCustomPortals.portals;
}


// Underground
if (typeof UnminedCustomUnderground !== "undefined" &&
    UnminedCustomUnderground.isEnabled &&
    UnminedCustomUnderground.underground) {
    
    UnminedMapProperties.underground = UnminedCustomUnderground.underground;
}


// Player build
if (typeof UnminedCustomPlayerbuild !== "undefined" &&
    UnminedCustomPlayerbuild.isEnabled &&
    UnminedCustomPlayerbuild.playerbuild) {
    
    UnminedMapProperties.playerbuild = UnminedCustomPlayerbuild.playerbuild;
}


// Landscapes
if (typeof UnminedCustomLandscapes !== "undefined" &&
    UnminedCustomLandscapes.isEnabled &&
    UnminedCustomLandscapes.landscapes) {
    
    UnminedMapProperties.landscapes = UnminedCustomLandscapes.landscapes;
}


// Players
if (UnminedPlayers && UnminedPlayers.length > 0) {
    UnminedMapProperties.playerMarkers =
        Unmined.createPlayerMarkers(UnminedPlayers);
}


// Start map
const mapElement = document.getElementById('map');
const unmined = new Unmined(mapElement, UnminedMapProperties, UnminedRegions);


    </script>
</body>

</html>
