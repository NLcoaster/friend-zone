<!DOCTYPE html>
<html>

<head>
    <title>uNmINeD</title>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <!-- OpenLayers  -->
    <link rel="stylesheet" type="text/css" href="lib/ol.css">
    <script src="lib/ol.js"></script>

    <!-- OpenLayers Context Menu -->
    <link href="lib/ol-contextmenu.css" rel="stylesheet">
    <script src="lib/ol-contextmenu.iife.js"></script>

    <!-- Toastify -->
    <script type="text/javascript" src="lib/toastify-js.js"></script>
    <link rel="stylesheet" type="text/css" href="lib/toastify-js.min.css">

    <!-- Map metadata generated by uNmINeD -->
    <script type="text/javascript" src="unmined.map.properties.js"></script>
    <script type="text/javascript" src="unmined.map.regions.js"></script>
    <script type="text/javascript" src="unmined.map.players.js"></script>

    <!-- Custom pillagers -->
    <script type="text/javascript" src="custom.pillager.js"></script>
    <!-- Custom shipwrecks -->
    <script type="text/javascript" src="custom.shipwrecks.js"></script>
    <!-- Custom portals -->
    <script type="text/javascript" src="custom.portals.js"></script>

    <!-- uNmINeD JS and CSS -->
    <script type="text/javascript" src="unmined.js"></script>
    <link rel="stylesheet" type="text/css" href="index.css">

</head>

<body>
    <div id="map"></div>

    <div class="dim-nav">
        <a href="../index.html"> Overworld ▾</a>
        <!-- Nether knop met dropdown -->
        <div class="dim-nav-dropdown">
            <a href="index.html" class="active" id="btn-Nether"> Nether ▾</a>
            <div class="dim-nav-menu" id="layer-menu">
                <div class="dim-nav-menu-title">Layers</div>
                <label><input type="checkbox" id="toggle-Bastion"           checked> Bastion</label>
                <label><input type="checkbox" id="toggle-NetherFortress"    checked> NetherFortress</label>
                <label><input type="checkbox" id="toggle-portals"           checked> Portals</label>
            </div>
        </div>
        <a href="../End/index.html"> End</a>
    </div>

    <script type="text/javascript">

        document.title = UnminedMapProperties.worldName + " - " + document.title;


        if (typeof UnminedCustomBastion !== "undefined" &&
            UnminedCustomBastion.isEnabled &&
            UnminedCustomBastion.bastion) {
            UnminedMapProperties.bastion = UnminedCustomBastion.bastion;
        }

        if (typeof UnminedCustomNetherfortress !== "undefined" &&
            UnminedCustomNetherfortress.isEnabled &&
            UnminedCustomNetherfortress.netherfortress) {
            UnminedMapProperties.netherfortress = UnminedCustomNetherfortress.netherfortress;
        }

        if (typeof UnminedCustomPortals !== "undefined" &&
            UnminedCustomPortals.isEnabled &&
            UnminedCustomPortals.portals) {
            UnminedMapProperties.portals = UnminedCustomPortals.portals;
        }

        if (UnminedPlayers && UnminedPlayers.length > 0) {
            UnminedMapProperties.playerMarkers = Unmined.createPlayerMarkers(UnminedPlayers);
        }

        const mapElement = document.getElementById('map');
        const unmined = new Unmined(mapElement, UnminedMapProperties, UnminedRegions);

        // ── Dropdown toggle ──────────────────────────────────────
        const btn  = document.getElementById('btn-nether');
        const menu = document.getElementById('layer-menu');

        btn.addEventListener('click', (e) => {
            e.preventDefault();
            menu.classList.toggle('open');
        });

        // Close menu when clicking outside
        document.addEventListener('click', (e) => {
            if (!btn.contains(e.target) && !menu.contains(e.target)) {
                menu.classList.remove('open');
            }
        });

        // ── Layer checkboxes ─────────────────────────────────────
        const layerToggles = [
            { id: 'toggle-bastion',             key: 'bastion'    },
            { id: 'toggle-netherfortress',      key: 'netherfortress'    },
            { id: 'toggle-portals',             key: 'portals'     },
        ];

        layerToggles.forEach(({ id, key }) => {
            const checkbox = document.getElementById(id);
            if (!checkbox) return;

            // Sync initial checkbox state with unmined options
            checkbox.checked = unmined._Unmined__options?.['show' + key] ?? true;

            checkbox.addEventListener('change', () => {
                unmined.toggleCustomLayer(key);
                checkbox.checked = unmined._Unmined__options?.['show' + key] ?? checkbox.checked;
            });
        });

    </script>
</body>

</html>
